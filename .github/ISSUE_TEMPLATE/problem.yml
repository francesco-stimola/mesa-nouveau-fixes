name: Problem with the patches
description: Something goes wrong with these patches, or a problem they fix is still there.
body:
  - type: markdown
    attributes:
      value: |
        This repository covers only the Mesa patches here. Kernel problems, and Mesa problems that also happen without these patches, belong to their own projects (links on the previous page). For a question, a blank issue is fine.

        Before opening:
        - use the latest release of the patches (the PPA has it);
        - check that the [GPU table](https://github.com/francesco-stimola/mesa-nouveau-fixes#which-gpus-need-which-patches) lists your GPU and, on Kepler, that your kernel has both video fixes listed under it;
        - run the checks in [SETUP.md, section 5](https://github.com/francesco-stimola/mesa-nouveau-fixes/blob/main/docs/SETUP.md#5-check-that-it-works): if `vainfo` lists no profiles, the firmware is missing;
        - try once with hardware decoding turned off: if the problem stays, it probably isn't in these patches.

        The patches were tested here only on a GeForce GT 240M, so a report from another GPU can only be looked into with the logs asked below.
  - type: checkboxes
    id: kernel
    attributes:
      label: Kernel
      options:
        - label: It happens with a released kernel, not a release candidate or linux-next.
          required: true
        - label: "On Kepler (GeForce 600 and 700): my kernel has both video fixes listed in the README."
  - type: input
    id: gpu
    attributes:
      label: GPU
      description: Model, and the output of `lspci -nn | grep -Ei 'vga|3d'`.
      placeholder: GeForce GT 710 (GK208B), 01:00.0 VGA compatible controller [0300] ...
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution and kernel
      description: Distribution, `uname -r`, and any patches on the kernel.
      placeholder: Fedora 44, 7.2.15-300.fc44.x86_64
    validations:
      required: true
  - type: input
    id: mesa
    attributes:
      label: Mesa and patches
      description: The Mesa version from `glxinfo -B`, and where the patches come from (the PPA, a release of this repository, your own build).
      placeholder: Mesa 26.0.8, PPA
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected and what happened instead. Program and version (Firefox, Brave, mpv...), and for video the codec and resolution.
    validations:
      required: true
  - type: dropdown
    id: software
    attributes:
      label: Does it also happen with hardware decoding turned off?
      options:
        - "Yes"
        - "No, only with hardware decoding"
        - Not a video problem
        - Not tried
    validations:
      required: true
  - type: textarea
    id: kernel-log
    attributes:
      label: Kernel log
      description: "`journalctl -k -b` after the problem, or `journalctl -k -b -1` if you had to reboot. Paste it even if it shows no errors."
      render: text
    validations:
      required: true
  - type: textarea
    id: backtrace
    attributes:
      label: Crash backtrace
      description: "If a program crashed: `coredumpctl info <program>`."
      render: text
  - type: input
    id: pstate
    attributes:
      label: GPU clock level
      description: "`sudo cat /sys/kernel/debug/dri/*/pstate`, see GPU clocks in the README."
  - type: dropdown
    id: ai
    attributes:
      label: Did an AI tool help with the tests or this report?
      description: Optional. It helps decide whether your results can be credited with a Tested-by in Mesa merge requests.
      options:
        - "No"
        - Yes, with the tests
        - Yes, with the report
        - Yes, with both
