name: PPA

# Keeps ppa:francesco-stimola/mesa-nouveau-fixes in step with Ubuntu: every
# day, for each series in ppa/series, it rebuilds Ubuntu's newest Mesa with
# the patches and uploads it when Ubuntu has moved on. Run it by hand to
# upload a new +nvfixN after a release.
#
# The patches come from the latest release tag (v*), not from main, so that
# patches still in review upstream stay out of the PPA until they are
# released. The scripts and ppa/series come from main.
#
# The signing key lives in the "ppa" environment, which only main can use.

on:
  schedule:
    # GitHub starts scheduled runs late on quiet repositories: this one has
    # started 4 to 6 hours after 05:17 UTC, between 09:30 and 11:00 UTC.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      series:
        description: Ubuntu series to build (empty for all in ppa/series)
        default: ''
      rebuild:
        description: Upload a new +nvfixN even if Ubuntu's Mesa has not changed
        type: boolean
        default: false
      dry_run:
        description: Build and sign, but do not upload
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ppa
  cancel-in-progress: false

jobs:
  series:
    name: Read ppa/series
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: read
        env:
          ONLY: ${{ inputs.series }}
        run: |
          matrix=$(grep -v '^#' ppa/series | awk -v only="$ONLY" '
            NF == 2 && (only == "" || $1 == only) {
              printf "%s{\"series\":\"%s\",\"patches\":\"%s\"}", sep, $1, $2; sep = ","
            }')
          if [ -z "$matrix" ]; then
            echo "No series to build" >&2
            exit 1
          fi
          echo "matrix={\"include\":[$matrix]}" >> "$GITHUB_OUTPUT"

  upload:
    name: ${{ matrix.series }}
    needs: series
    runs-on: ubuntu-24.04
    environment: ppa
    # A normal run takes a few minutes; a stalled connection to Launchpad
    # must not hold the job for GitHub's 6-hour default.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.series.outputs.matrix) }}
    container: ubuntu:${{ matrix.series }}
    steps:
      - name: Install the packaging tools
        run: |
          sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl jq git gnupg devscripts dput quilt dpkg-dev xz-utils

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Take the patches from the latest release
        id: release
        env:
          DIR: ${{ matrix.patches }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          mkdir -p "$RUNNER_TEMP/release"
          git archive "$tag" "patches/$DIR" | tar -x -C "$RUNNER_TEMP/release"
          echo "::notice::patches/$DIR from $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build, sign and upload
        env:
          SERIES: ${{ matrix.series }}
          PATCHES: ${{ runner.temp }}/release/patches/${{ matrix.patches }}
          SOURCE_REF: ${{ steps.release.outputs.tag }}
          MODE: ${{ inputs.rebuild && 'rebuild' || 'auto' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          SIGN_KEY: 2CBE5BAC5D6898AE2C8C39D6981DDFA12CDB08A7
          KEY: ${{ secrets.PPA_GPG_KEY }}
          PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GNUPGHOME"
          printf '%s\n' "$KEY" | gpg --batch --quiet --import
          printf '%s' "$PASSPHRASE" > "$RUNNER_TEMP/passphrase"
          chmod 600 "$RUNNER_TEMP/passphrase"
          export GPG_PASSPHRASE_FILE="$RUNNER_TEMP/passphrase"
          ./scripts/ppa-upload.sh "$SERIES" "$PATCHES"

  keepalive:
    # GitHub disables scheduled workflows in public repositories after 60
    # days without commits. Re-enabling the workflow through the API keeps
    # the daily check running.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/ppa.yml/enable"
