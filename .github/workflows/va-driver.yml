name: VA driver

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu-24-04:
    name: Build on Ubuntu 24.04 Mesa
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Enable source packages
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update

      - name: Install build dependencies
        run: sudo apt-get build-dep -y mesa

      - name: Fetch Ubuntu's Mesa source
        working-directory: ${{ runner.temp }}
        run: |
          apt-get source mesa
          echo "MESA_SRC=$(ls -d "$RUNNER_TEMP"/mesa-*/)" >> "$GITHUB_ENV"

      - name: Build the patched VA driver
        run: ./scripts/build-va-driver.sh "$MESA_SRC" patches/mesa-25.2 "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v4
        with:
          name: nouveau_drv_video-ubuntu-24.04
          path: |
            ${{ runner.temp }}/out/nouveau_drv_video.so
            ${{ runner.temp }}/out/src/VERSION

  mesa-main:
    name: Apply to Mesa main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the patches still apply
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/mesa/mesa.git "$RUNNER_TEMP/mesa"
          git -C "$RUNNER_TEMP/mesa" log -1 --format='Mesa main at %h (%cs)'
          git -C "$RUNNER_TEMP/mesa" apply --check "$GITHUB_WORKSPACE"/patches/mesa-main/*.patch
