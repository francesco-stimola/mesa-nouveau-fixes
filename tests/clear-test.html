<!doctype html>
<meta charset="utf-8">
<title>nouveau clear test</title>
<canvas id="c" width="16" height="16"></canvas>
<pre id="out">running…</pre>
<script>
'use strict';
// Reproducer for patch 0001 in WebGL, by Kush Chandak
// (https://github.com/francesco-stimola/mesa-nouveau-fixes/issues/1).
//
// WebGL leaves new textures for ANGLE to zero-fill ("robust resource
// init"), which it does with glClearTexImage: colour to 0, depth to 1.0.
// That is the path where Mesa's nv50 and nvc0 clear hooks misread the
// surface.
// Each test first dirties memory with a texture of the same shape, then
// checks that a fresh texture reads back as cleared.
const ROUNDS = 10;
const SIZES = [1, 3, 64, 129, 256, 512];
const LAYOUTS = ['2d', 'mip1', 'layer1'];

const canvas = document.getElementById('c');
const out = document.getElementById('out');
const gl = canvas.getContext('webgl2', {antialias: false});
const res = {renderer: null, tests: 0, skipped: 0, failures: [], badPixels: 0,
             glError: 0, contextLost: false};
canvas.addEventListener('webglcontextlost', () => { res.contextLost = true; });

function report() {
  out.textContent = JSON.stringify(res, null, 1);
  fetch('/result', {method: 'POST', body: JSON.stringify(res)});
}

if (!gl) {
  res.renderer = 'no WebGL2';
  report();
  throw new Error('no WebGL2');
}
const dbg = gl.getExtension('WEBGL_debug_renderer_info');
res.renderer = gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER);

function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, `#version 300 es
uniform float z;
const vec2 v[3] = vec2[3](vec2(-1, -1), vec2(3, -1), vec2(-1, 3));
void main() { gl_Position = vec4(v[gl_VertexID], z, 1); }`));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, `#version 300 es
precision mediump float;
out vec4 o;
void main() { o = vec4(0, 1, 0, 1); }`));
gl.linkProgram(prog);
gl.useProgram(prog);
gl.uniform1f(gl.getUniformLocation(prog, 'z'), 0.5);
const fbo = gl.createFramebuffer();
gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);

// [name, internal format, has alpha]
const COLOR = [['RGBA8', gl.RGBA8, true], ['RGBA4', gl.RGBA4, true],
               ['RGB10_A2', gl.RGB10_A2, true], ['RGB565', gl.RGB565, false],
               ['RG8', gl.RG8, false], ['R8', gl.R8, false]];
// [name, internal format, attachment]
const DEPTH = [['DEPTH_COMPONENT16', gl.DEPTH_COMPONENT16, gl.DEPTH_ATTACHMENT],
               ['DEPTH_COMPONENT24', gl.DEPTH_COMPONENT24, gl.DEPTH_ATTACHMENT],
               ['DEPTH_COMPONENT32F', gl.DEPTH_COMPONENT32F, gl.DEPTH_ATTACHMENT],
               ['DEPTH24_STENCIL8', gl.DEPTH24_STENCIL8, gl.DEPTH_STENCIL_ATTACHMENT],
               ['DEPTH32F_STENCIL8', gl.DEPTH32F_STENCIL8, gl.DEPTH_STENCIL_ATTACHMENT]];

// layout '2d': level 0; 'mip1': level 1 of a 2-level texture;
// 'layer1': layer 1 of a 3-layer array. The tested image is size x size.
function makeTex(internal, size, layout) {
  const t = gl.createTexture();
  if (layout === 'layer1') {
    gl.bindTexture(gl.TEXTURE_2D_ARRAY, t);
    gl.texStorage3D(gl.TEXTURE_2D_ARRAY, 1, internal, size, size, 3);
  } else if (layout === 'mip1') {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 2, internal, size * 2, size * 2);
  } else {
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texStorage2D(gl.TEXTURE_2D, 1, internal, size, size);
  }
  return t;
}
function attach(point, t, layout) {
  if (layout === 'layer1')
    gl.framebufferTextureLayer(gl.FRAMEBUFFER, point, t, 0, 1);
  else
    gl.framebufferTexture2D(gl.FRAMEBUFFER, point, gl.TEXTURE_2D, t,
                            layout === 'mip1' ? 1 : 0);
}
function detachAll() {
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, null, 0);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_STENCIL_ATTACHMENT, gl.TEXTURE_2D, null, 0);
}
function complete() {
  return gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
}
function check(kind, name, size, layout, expect) {
  const px = new Uint8Array(size * size * 4);
  gl.readPixels(0, 0, size, size, gl.RGBA, gl.UNSIGNED_BYTE, px);
  let bad = 0, first = null;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] !== expect[0] || px[i + 1] !== expect[1] ||
        px[i + 2] !== expect[2] || px[i + 3] !== expect[3]) {
      if (!bad) first = Array.from(px.subarray(i, i + 4));
      bad++;
    }
  }
  res.tests++;
  if (bad) {
    res.badPixels += bad;
    if (res.failures.length < 50)
      res.failures.push({kind, name, size, layout, bad, of: size * size, first});
  }
}

function testColor([name, internal, alpha], size, layout) {
  detachAll();
  const dirty = makeTex(internal, size, layout);
  attach(gl.COLOR_ATTACHMENT0, dirty, layout);
  if (!complete()) { res.skipped++; detachAll(); gl.deleteTexture(dirty); return; }
  gl.viewport(0, 0, size, size);
  gl.clearColor(0.35, 0.6, 0.8, 0.9);
  gl.clear(gl.COLOR_BUFFER_BIT);
  detachAll();
  gl.deleteTexture(dirty);

  const t = makeTex(internal, size, layout);
  attach(gl.COLOR_ATTACHMENT0, t, layout);
  check('color', name, size, layout, [0, 0, 0, alpha ? 0 : 255]);
  detachAll();
  gl.deleteTexture(t);
}

function testDepth([name, internal, point], size, layout) {
  detachAll();
  const dirty = makeTex(internal, size, layout);
  attach(point, dirty, layout);
  if (!complete()) { res.skipped++; detachAll(); gl.deleteTexture(dirty); return; }
  gl.viewport(0, 0, size, size);
  gl.clearDepth(0);
  gl.clearStencil(0x5a);
  gl.clear(gl.DEPTH_BUFFER_BIT | gl.STENCIL_BUFFER_BIT);
  detachAll();
  gl.deleteTexture(dirty);

  // A fresh depth buffer must read 1.0, so a triangle at depth 0.75
  // passes GL_LESS everywhere and the colour buffer turns green.
  const d = makeTex(internal, size, layout);
  const c = makeTex(gl.RGBA8, size, '2d');
  attach(gl.COLOR_ATTACHMENT0, c, '2d');
  attach(point, d, layout);
  gl.enable(gl.DEPTH_TEST);
  gl.depthFunc(gl.LESS);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.DEPTH_TEST);
  check('depth', name, size, layout, [0, 255, 0, 255]);
  detachAll();
  gl.deleteTexture(d);
  gl.deleteTexture(c);
}

let round = 0;
function step() {
  for (const size of SIZES)
    for (const layout of LAYOUTS) {
      for (const f of COLOR) testColor(f, size, layout);
      for (const f of DEPTH) testDepth(f, size, layout);
    }
  gl.finish();
  out.textContent = `round ${round + 1}/${ROUNDS}, ${res.tests} tests, ` +
                    `${res.failures.length} failing`;
  if (++round < ROUNDS && !res.contextLost) {
    setTimeout(step, 0);
  } else {
    res.glError = gl.getError();
    report();
  }
}
setTimeout(step, 100);
</script>
